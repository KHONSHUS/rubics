<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cube</h1>
    <div class="bar" id="sizes">
      <button class="b" data-n="2">2×2</button>
      <button class="b" data-n="3">3×3</button>
    </div>
    <div class="bar">
      <button class="b" id="scr">Scramble</button>
      <button class="b" id="rst">Restart</button>
    </div>
    <div class="bar" id="themes">
      <button class="b" data-th="light">Light</button>
      <button class="b" data-th="dark">Dark</button>
    </div>
  </header>

  <div id="stage"><div id="cube"></div></div>

  <footer>
    <div class="info"><span>Moves: <span id="moves">0</span></span><span id="st">Ready</span></div>
    <div class="keys" id="keys"></div>
    <p class="hint">Keys: U D L R F B turn a face (hold Shift for reverse) · Arrows or drag to look around · Space scramble · Esc restart</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
